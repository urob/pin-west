name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused as the release gate, see release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # The suite builds real local git repos as stand-in remotes. conftest
      # sets a per-repo identity, but git still wants a default branch name.
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Check the lockfile is up to date
        run: uv lock --check

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uvx ruff check

      - name: Format
        run: uvx ruff format --check

      - name: Types
        run: uv run ty check

  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Flake build
        run: nix build .#pin-west -L
