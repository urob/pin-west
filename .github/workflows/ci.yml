name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused as the release gate, see release.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The suite builds real local git repos as stand-in remotes. conftest
      # sets a per-repo identity, but git still wants a default branch name.
      - name: Configure git
        run: git config --global init.defaultBranch main

      - name: Check the lockfile is up to date
        run: uv lock --check

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run ty check

  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Flake build
        run: nix build .#pin-west -L
